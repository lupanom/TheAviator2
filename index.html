<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta name="ad.size" content="width=300,height=600">
	<title>The Aviator 2</title>
	<meta name="description" content="An extension of Karim Maaloul's game The Aviator." />
	<meta name="keywords" content="three.js, game, aviator, browser, javascript" />
	<meta name="author" content="Michel Helms for Codrops" />
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
	<link rel="stylesheet" type="text/css" href="game.css" />
	<script src="https://cdn.jsdelivr.net/npm/three@0.139.2/build/three.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/three@0.139.2/examples/js/controls/OrbitControls.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.10.2/gsap.min.js"></script>
	<script src="https://s0.2mdn.net/ads/studio/Enabler.js"></script>
</head>
<body>
  <script>
    window.edCustomData = {};
    /*window.THREE = THREE;*/
    /*window.gsap = gsap;*/

    // If true, start function. If false, listen for INIT.
    window.onload = async function() {
      if (Enabler.isInitialized()) {
        await enablerInitHandler();
      } else {
        Enabler.addEventListener(studio.events.StudioEvent.INIT, enablerInitHandler);
      }
    }

    async function enablerInitHandler() {
      //await window.edCustomData.setUp()
      // await window.edCustomData.start()
      document.getElementById('exit-button').addEventListener('click', () => {
        Enabler.exit('Exit CTA');
      })

      let touchX, deltaX;
      let isStartingSwipe = false, isCompletingSwipe = false;

      ['touchstart', 'mousedown'].forEach((event) => {
        document.addEventListener((event), (e) => {
          touchX = e.touches ? e.touches[0].clientX : e.clientX; // salvo le coordinate del touch
          isStartingSwipe = true;
        })
      });

      ['touchmove', 'mousemove'].forEach((event) => {
        document.addEventListener((event), (e) => {
          deltaX = e.touches ? e.touches[0].clientX - touchX : e.clientX - touchX; // calcolo lo spostamento rispetto all'inizio del touch sulle x
          touchX = e.touches ? e.touches[0].clientX : e.clientX; // salvo le nuove coordinate del touch

          if (isStartingSwipe && Math.abs(deltaX) > 1) {
            isCompletingSwipe = true;
          }
        })
      });

      ['touchend', 'mouseup'].forEach((event) => {
        document.addEventListener((event), (e) => {
          isStartingSwipe = false;
          if (isCompletingSwipe) {
            Enabler.counter('Hotspot1Click', false);
            Enabler.counter('Hotspot2Click', false);
            Enabler.counter('Hotspot3Click', true);
          } else {
            Enabler.counter('Hotspot1Click', false);
            Enabler.counter('Hotspot4Click', false);
            Enabler.counter('Hotspot5Click', true);
          }

          isCompletingSwipe = false;
        })
      });
    }
  </script>
	<div class="game-holder" id="gameHolder">
		<div class="header">
			<div class="header__title-wrap">
				<h1 class="header__title">
					<span class="header__title-pre">The</span> 
					<span class="header__title-main">Aviator 2</span>
				</h1>
        <h2 id="exit-button">CTA DI TEST</h2>
			</div>
			<div class="score" id="score">
				<div class="score__content" id="level">
					<div class="score__label">level</div>
					<div class="score__value score__value--level" id="levelValue">1</div>
					<svg class="level-circle" id="levelCircle" viewbox="0 0 200 200">
						<circle id="levelCircleBgr" r="80" cx="100" cy="100" fill="none" stroke="#d1b790" stroke-width="24px" />
						<circle id="levelCircleStroke" r="80" cx="100" cy="100" fill="none" stroke="#68c3c0" stroke-width="14px" stroke-dasharray="502" />
					</svg>
				</div>
				<div class="score__content score__content--fixed" id="dist">
					<div class="score__label">distance</div>
					<div class="score__value score__value--dist" id="distValue">0</div>
				</div>
				<div class="score__content score__content--fixed" id="coins">
					<div class="score__label">coins</div>
					<div class="score__value score__value--dist" id="coinsValue">0</div>
				</div>
				<div class="score__content" id="lifes">
					<div class="score__label">life</div>
				</div>
			</div>
		</div>

		<div class="world" id="world">
			<canvas id="threejs-canvas"></canvas>
		</div>

		<div class="message--replay" id="replayMessage">
			Click to Replay
		</div>

		<div id="error">
			<p><b>Error</b></p>
			<p id="error-message"></p>
		</div>

		<div id="new-level">
			<p>Level</p>
			<p>1</p>
		</div>

		<div id="intro-screen" class="visible">
			<button type="button">Start</button>
		</div>

		<div id="score-screen">
			<div>
				<p class="headline">Map complete</p>
				<div class="lines">
					<div>
						<span>Coins</span>
						<span><span id="score-coins-collected">129</span> / <span id="score-coins-total">136</span></span>
					</div>
					<div>
						<span>Enemies killed</span>
						<span><span id="score-enemies-killed">3</span> / <span id="score-enemies-total">20</span></span>
					</div>
					<div>
						<span>Shots fired</span>
						<span><span id="score-shots-fired">9820</span></span>
					</div>
					<div>
						<span>Damage taken</span>
						<span><span id="score-lifes-lost">1</span></span>
					</div>
				</div>
			</div>
			<br/>
			Thanks for playing!
		</div>
	</div>

	<script type="text/javascript" src="game.js"></script>
</body>
</html>
